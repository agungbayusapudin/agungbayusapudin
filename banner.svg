<svg width="100%" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050915"/>
      <stop offset="55%" stop-color="#0f1c3f"/>
      <stop offset="100%" stop-color="#1b2a5e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6c9"/>
      <stop offset="40%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#ff4d00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00ff9c" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="enemyLaser" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff2b5e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ff2b5e" stop-opacity="1"/>
    </linearGradient>
    <style>
      .pxfont { font-family: 'Courier New', monospace; font-weight: bold; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- sky -->
  <rect width="900" height="220" fill="url(#bg)"/>

  <!-- scrolling starfield -->
  <g fill="#ffffff">
    <circle cx="40" cy="30" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="80" r="1"><animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="20" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="55" r="1.2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="15" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="90" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="25" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="65" r="1.1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="35" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="90" r="1"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="1.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- distant clouds / parallax haze -->
  <ellipse cx="150" cy="190" rx="120" ry="14" fill="#2b3f7a" opacity="0.35">
    <animate attributeName="cx" values="1000;-150" dur="9s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="600" cy="200" rx="160" ry="16" fill="#2b3f7a" opacity="0.3">
    <animate attributeName="cx" values="1100;-200" dur="12s" repeatCount="indefinite"/>
  </ellipse>

  <!-- HUD: score / status like a real game overlay -->
  <text x="20" y="26" class="pxfont" font-size="14" fill="#00ff9c">SCORE 015420</text>
  <text x="20" y="46" class="pxfont" font-size="12" fill="#7fe3ff">STAGE 03</text>
  <g>
    <text x="770" y="26" class="pxfont" font-size="14" fill="#ff2b5e">HP</text>
    <rect x="800" y="14" width="80" height="10" rx="2" fill="#2a2a2a" stroke="#555" stroke-width="1"/>
    <rect x="800" y="14" width="80" height="10" rx="2" fill="#ff2b5e">
      <animate attributeName="width" values="80;62;80;74;80" keyTimes="0;0.3;0.5;0.75;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- enemy fighters, flying in from the right, occasionally destroyed -->
  <g>
    <animateMotion dur="3.6s" repeatCount="indefinite" path="M 980,70 L -60,70"/>
    <g transform="scale(-0.85,0.85)">
      <path d="M0,0 L60,4 L70,0 L60,-4 L0,0 Z" fill="#d64550"/>
      <path d="M18,0 L-4,14 L14,4 Z" fill="#7a1f28"/>
      <path d="M18,0 L-4,-14 L14,-4 Z" fill="#7a1f28"/>
      <ellipse cx="45" cy="0" rx="5" ry="2.5" fill="#ffcc00"/>
    </g>
  </g>
  <g>
    <animateMotion dur="4.4s" repeatCount="indefinite" path="M 980,150 L -60,150" begin="0.8s"/>
    <g transform="scale(-0.7,0.7)">
      <path d="M0,0 L60,4 L70,0 L60,-4 L0,0 Z" fill="#d64550"/>
      <path d="M18,0 L-4,14 L14,4 Z" fill="#7a1f28"/>
      <path d="M18,0 L-4,-14 L14,-4 Z" fill="#7a1f28"/>
      <ellipse cx="45" cy="0" rx="5" ry="2.5" fill="#ffcc00"/>
    </g>
  </g>

  <!-- explosion where an enemy gets hit -->
  <circle cx="560" cy="70" r="0" fill="url(#fire)">
    <animate attributeName="r" values="0;0;26;0" keyTimes="0;0.38;0.46;0.58" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.38;0.42;0.58" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="330" cy="150" r="0" fill="url(#fire)">
    <animate attributeName="r" values="0;0;20;0" keyTimes="0;0.5;0.56;0.66" dur="4.4s" repeatCount="indefinite" begin="0.8s"/>
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.5;0.54;0.66" dur="4.4s" repeatCount="indefinite" begin="0.8s"/>
  </circle>

  <!-- player's outgoing laser bolts -->
  <g>
    <rect x="0" y="68" width="55" height="4" rx="2" fill="url(#laser)">
      <animate attributeName="x" values="60;600" dur="1.1s" repeatCount="indefinite" begin="0.1s"/>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="1.1s" repeatCount="indefinite" begin="0.1s"/>
    </rect>
    <rect x="0" y="148" width="55" height="4" rx="2" fill="url(#laser)">
      <animate attributeName="x" values="60;370" dur="1.3s" repeatCount="indefinite" begin="1.0s"/>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="1.3s" repeatCount="indefinite" begin="1.0s"/>
    </rect>
    <rect x="0" y="68" width="50" height="3" rx="2" fill="url(#laser)">
      <animate attributeName="x" values="60;600" dur="1.1s" repeatCount="indefinite" begin="0.35s"/>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="1.1s" repeatCount="indefinite" begin="0.35s"/>
    </rect>
  </g>

  <!-- enemy incoming laser bolts -->
  <rect x="850" y="105" width="45" height="3" rx="2" fill="url(#enemyLaser)">
    <animate attributeName="x" values="850;150" dur="1.6s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="1.6s" repeatCount="indefinite" begin="0.5s"/>
  </rect>

  <!-- player fighter jet with engine flicker, holds position with slight bob -->
  <g transform="translate(70,105)">
    <animateTransform attributeName="transform" type="translate" values="70,100; 70,112; 70,100" dur="1.6s" repeatCount="indefinite" additive="sum"/>
    <g transform="scale(1.15)">
      <ellipse cx="-8" cy="0" rx="9" ry="3" fill="url(#fire)">
        <animate attributeName="rx" values="9;13;9" dur="0.15s" repeatCount="indefinite"/>
      </ellipse>
      <path d="M0,0 L62,4 L74,0 L62,-4 L0,0 Z" fill="#e8eef7"/>
      <ellipse cx="47" cy="0" rx="6" ry="3" fill="#00d4ff"/>
      <path d="M18,0 L-6,17 L14,4 Z" fill="#3a6df0"/>
      <path d="M18,0 L-6,-17 L14,-4 Z" fill="#3a6df0"/>
      <path d="M2,0 L-15,10 L4,2 Z" fill="#274bb5"/>
      <path d="M2,0 L-15,-10 L4,-2 Z" fill="#274bb5"/>
    </g>
  </g>

  <!-- muzzle flash at the nose of the player jet -->
  <circle cx="140" cy="105" r="0" fill="url(#glow)">
    <animate attributeName="r" values="0;7;0" dur="0.35s" repeatCount="indefinite"/>
  </circle>

</svg>
